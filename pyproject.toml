[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reifyscene"
# Canonical version lives in the VERSION file (single source of truth, read
# by the tag workflows and gstack tooling); setuptools reads it at build time.
dynamic = ["version"]
description = "Prototype room-scale 4D reconstruction pipeline scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "evan-wes" }
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
vision = [
  "opencv-python>=4.10",
  "torch>=2.2",
  "torchvision>=0.17",
  "Pillow>=10.0",
  "huggingface_hub[cli]>=0.23",
  # einshape is required by the ported tapnet (bootstapir) point-tracker model
  # in reifyscene/tracking/tapnet/ — kept as a real dep so that port stays
  # byte-faithful to Shape-of-Motion's preproc/tapnet_torch reference.
  "einshape>=1.0",
]
geometry = [
  "scipy>=1.13",
]
calibration = [
  "pycolmap==3.13.0",
]
pose_refine = [
  # Bundle-adjustment pose refinement (reifyscene/geometry/pose_refine.py): seeds a
  # pycolmap Reconstruction with the backend geometry + VGGSfM tracks and runs
  # robust iterative BA. pycolmap is pinned to match the calibration extra (and
  # the hloc patches in setup_reifyscene.sh); hydra-core/omegaconf are required by
  # the vendored VGGSfM tracker (third_party/vggt) and are otherwise undeclared.
  "pycolmap==3.13.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "scipy>=1.13",
]
vggt_long = [
  "pypose>=0.7",
  "trimesh>=4.0",
  "matplotlib>=3.8",
]

[project.scripts]
reifyscene = "reifyscene.cli.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["reifyscene*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored byte-for-byte from DeepMind's tapnet torch port (kept re-diffable
# against upstream); not linted to our style.
extend-exclude = ["reifyscene/tracking/tapnet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
