render:
  device: auto
  width: 800
  height: 450
  point_limit: 1000
  dynamic_point_budget: 180
  frame_stride: 1
  max_frames_per_path: 24
  label_entities: true
  use_gpu_projection: true
  enabled_paths:
    orbit: true
    overhead: false
    replay: false
    follow_human: false
    follow_object: false
