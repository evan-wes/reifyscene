run:
  name: room4d_dev
  output_dir: artifacts/runs/room4d_dev

dataset:
  input_dir: data/raw
  cache_dir: artifacts/cache
  keyframe_stride: 15

models:
  geometry_backend: vggt
  tracker_backend: cotracker
  use_densepose: true
  use_smpl: true
  detect_objects: true


geometry:
  ground_plane:
    enabled: true
    max_frames: 24
    max_points_per_frame: 3000
    ransac_iterations: 160
    distance_threshold: 0.035
    min_inlier_ratio: 0.06
    min_alignment_cos: 0.45
    alignment_weight: 0.18
    camera_up_axis: -y
    random_seed: 7
    manual_up_vector: null
    lock_gravity_vector: false
    floor_height_quantile: 0.06
    max_saved_candidates: 12

optimization:
  schedule: stage1_sync_pose
  max_iterations: 100

scene:
  timeline_source: geometry

render:
  backend_name: gaussian_layered
  quality_mode: realtime
  device: auto
  width: 800
  height: 450
  point_limit: 10000
  dynamic_point_budget: 180
  max_dynamic_entities_per_kind: 3
  frame_stride: 1
  max_frames_per_path: 32
  debug_triptych: true
  use_gpu_projection: true
  enabled_paths:
    orbit: true
    overhead: false
    replay: false
    follow_human: false
    follow_object: false
  offline_high_quality:
    render_scale: 2
    filter_radius: 1.1
    detail_strength: 0.12
    static_source_count: 3
    static_source_point_budget: 7000
    dynamic_sprite_scale: 1.0
    dynamic_sprite_sharpen: 0.4
    dynamic_sprite_min_alpha: 12
    dynamic_sprite_alpha_blur: 0.9
    dynamic_soft_depth_margin: 0.08
    dynamic_soft_depth_scale: 0.18
    dynamic_observation_bank_size: 3
    dynamic_temporal_switch_penalty: 0.18
    dynamic_view_weight: 0.35
    gaussian_fill_weight: 0.35
    nerf_refinement:
      enabled: true
      blend_weight: 0.28
      detail_strength: 0.18
      sharpen_radius: 1.1
      max_dynamic_boost: 0.45

evaluation:
  reprojection_error_p90_px_max: 24.0
  mean_human_fragments_max: 1.5
  height_abs_p90_max: 0.40
  heldout_psnr_mean_min: 11.0
  geometry: {}
  tracking: {}
  rendering:
    max_views: 4
