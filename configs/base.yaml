run:
  name: room4d_dev
  output_dir: artifacts/runs/room4d_dev

dataset:
  input_dir: data/raw
  cache_dir: artifacts/cache
  keyframe_stride: 15

models:
  geometry_backend: vggt
  tracker_backend: cotracker
  use_densepose: true
  use_smpl: true
  detect_objects: true

optimization:
  schedule: stage1_sync_pose
  max_iterations: 100

scene:
  timeline_source: geometry

render:
  backend_name: gaussian_layered
  quality_mode: realtime
  device: auto
  width: 800
  height: 450
  point_limit: 10000
  dynamic_point_budget: 180
  frame_stride: 1
  max_frames_per_path: 32
  debug_triptych: true
  use_gpu_projection: true
  enabled_paths:
    orbit: true
    overhead: false
    replay: false
    follow_human: false
    follow_object: false
  offline_high_quality:
    render_scale: 2
    filter_radius: 1.1
    detail_strength: 0.12
    nerf_refinement:
      enabled: true
      blend_weight: 0.28
      detail_strength: 0.18
      sharpen_radius: 1.1
      max_dynamic_boost: 0.45
